version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: openplaud-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: openplaud
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openplaud-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Database
      DATABASE_URL: postgresql://postgres:postgres@db:5432/openplaud

      # Auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      APP_URL: ${APP_URL:-http://localhost:3000}

      # Encryption
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # Storage (optional defaults)
      DEFAULT_STORAGE_TYPE: ${DEFAULT_STORAGE_TYPE:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}

      # Live transcription (browser microphone capture)
      LIVE_TRANSCRIPTION_ENABLED: ${LIVE_TRANSCRIPTION_ENABLED:-false}
      LIVE_TRANSCRIPTION_MAX_SESSION_MINUTES: ${LIVE_TRANSCRIPTION_MAX_SESSION_MINUTES:-30}
      LIVE_TRANSCRIPTION_DEFAULT_LANGUAGE: ${LIVE_TRANSCRIPTION_DEFAULT_LANGUAGE:-auto}
      LIVE_TRANSCRIPTION_DEFAULT_MODEL: ${LIVE_TRANSCRIPTION_DEFAULT_MODEL:-small}
      WHISPERLIVE_ENABLED: ${WHISPERLIVE_ENABLED:-false}
      WHISPERLIVE_URL: ${WHISPERLIVE_URL:-http://whisperlive:9090}
      WHISPERLIVE_TIMEOUT_MS: ${WHISPERLIVE_TIMEOUT_MS:-15000}
    volumes:
      - audio:/app/audio
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3

  whisperlive:
    image: ${WHISPERLIVE_IMAGE:-ghcr.io/collabora/whisperlive-cpu:latest}
    container_name: openplaud-whisperlive
    restart: unless-stopped
    profiles:
      - live-transcription
    expose:
      - "9090"
    # Optional debug-only host exposure. Keep disabled in production.
    # ports:
    #   - "9090:9090"

volumes:
  pgdata:
    driver: local
  audio:
    driver: local
